<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快捷爬取 · 抖音 / B站</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --card2: #1d212b; --line: #2a2f3c;
    --tx: #e8eaf0; --tx2: #9aa3b5; --acc: #4f8cff; --acc2: #7c5cff;
    --ok: #3ecf8e; --dy: #fe2c55; --bili: #00a1d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 500px at 50% -100px, #1b2233 0%, var(--bg) 60%);
    color: var(--tx); font: 15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  }
  header { margin: 42px 16px 10px; text-align: center; }
  header h1 { font-size: 26px; letter-spacing: 1px; }
  header h1 .g { background: linear-gradient(90deg, var(--acc), var(--acc2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { color: var(--tx2); margin-top: 6px; font-size: 13px; }
  main { width: min(720px, 94vw); }
  .search { display: flex; gap: 10px; margin: 22px 0 8px; }
  .search input {
    flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--tx);
    border-radius: 12px; padding: 13px 16px; font-size: 15px; outline: none; transition: border .15s;
  }
  .search input:focus { border-color: var(--acc); }
  .search button {
    background: linear-gradient(90deg, var(--acc), var(--acc2)); color: #fff; border: 0;
    border-radius: 12px; padding: 0 26px; font-size: 15px; cursor: pointer; font-weight: 600;
  }
  .search button:disabled { opacity: .55; cursor: wait; }
  .hint { color: var(--tx2); font-size: 12.5px; text-align: center; margin-bottom: 14px; }
  .hint b.dy { color: var(--dy); } .hint b.bl { color: var(--bili); }
  .history { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
  .history span {
    background: var(--card); border: 1px solid var(--line); color: var(--tx2);
    border-radius: 999px; padding: 3px 12px; font-size: 12px; cursor: pointer; max-width: 240px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .history span:hover { color: var(--tx); border-color: var(--acc); }
  .status { text-align: center; color: var(--tx2); padding: 30px 0; font-size: 14px; }
  .status.err { color: #ff7b72; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; display: flex; gap: 16px;
  }
  .card .cover {
    width: 168px; height: 100px; object-fit: cover; border-radius: 10px; background: var(--card2); flex-shrink: 0;
  }
  .card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 1px 7px; margin-right: 8px; vertical-align: 2px; }
  .badge.dy { background: var(--dy); color: #fff; } .badge.bl { background: var(--bili); color: #fff; }
  .title { font-size: 15.5px; font-weight: 600; line-height: 1.45; word-break: break-all; }
  .meta { color: var(--tx2); font-size: 12.5px; margin-top: 4px; }
  .q { margin-top: auto; padding-top: 10px; font-size: 13px; color: var(--tx2); }
  .q b { color: var(--ok); font-weight: 600; }
  .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .actions a, .actions button {
    text-decoration: none; border: 0; border-radius: 10px; padding: 9px 20px; font-size: 14px;
    cursor: pointer; font-weight: 600; color: #fff;
  }
  .btn-main { background: linear-gradient(90deg, var(--acc), var(--acc2)); }
  .btn-plain { background: var(--card2); border: 1px solid var(--line) !important; color: var(--tx2) !important; }
  .parts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .parts button {
    background: var(--card2); border: 1px solid var(--line); color: var(--tx2);
    border-radius: 7px; padding: 2px 10px; font-size: 12px; cursor: pointer;
  }
  .parts button.on { color: #fff; border-color: var(--acc); background: #22304d; }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
  .gal img { width: 100%; height: 96px; object-fit: cover; border-radius: 8px; background: var(--card2); }
  footer { margin: auto 0 26px; color: var(--tx2); font-size: 12px; text-align: center; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--tx2); border-top-color: transparent; border-radius: 50%; animation: r 0.8s linear infinite; vertical-align: -2px; margin-right: 7px; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>⚡ 快捷<span class="g">爬取</span>源视频</h1>
  <p>粘贴分享链接 → 解析 → 下载最高画质（无水印）</p>
</header>

<main>
  <div class="search">
    <input id="q" placeholder="粘贴抖音分享文案 / v.douyin.com 短链 / B站 BV·av·b23.tv 链接，回车解析" autofocus>
    <button id="go">解析</button>
  </div>
  <div class="hint">支持 <b class="dy">抖音</b>（含图集）与 <b class="bl">B站</b>（含分P）· B站免登录最高 720P · 仅个人学习备份，尊重原作者版权</div>
  <div class="history" id="hist"></div>
  <div class="status" id="status">等待输入链接…</div>
  <div id="result"></div>
</main>

<footer>本地服务 127.0.0.1 · 解析与下载均经本机中转，不经过第三方服务器</footer>

<script>
const $ = (s) => document.querySelector(s);
const input = $('#q'), go = $('#go'), status = $('#status'), result = $('#result');
let curKey = null;

const fmtMB = (n) => n >= 1048576 ? (n / 1048576).toFixed(2) + ' MB' : Math.ceil(n / 1024) + ' KB';
const fmtDur = (ms) => { const s = Math.round(ms / 1000); return (s >= 60 ? Math.floor(s / 60) + '分' : '') + (s % 60) + '秒'; };

function setStatus(html, err) { status.className = 'status' + (err ? ' err' : ''); status.innerHTML = html; }

function loadHist() {
  try {
    const h = JSON.parse(localStorage.getItem('dl_hist') || '[]');
    const box = $('#hist');
    box.innerHTML = '';
    for (const t of h.slice(-6).reverse()) {
      const s = document.createElement('span');
      s.textContent = t; s.title = t;
      s.onclick = () => { input.value = t; run(); };
      box.appendChild(s);
    }
  } catch (_) {}
}
function pushHist(t) {
  try {
    const h = JSON.parse(localStorage.getItem('dl_hist') || '[]');
    if (!h.includes(t)) { h.push(t); localStorage.setItem('dl_hist', JSON.stringify(h.slice(-10))); loadHist(); }
  } catch (_) {}
}

async function run() {
  const v = input.value.trim();
  if (!v) return;
  go.disabled = true; result.innerHTML = '';
  setStatus('<span class="spin"></span>解析中…（抖音画质探测约需几秒）');
  try {
    const r = await fetch('/api/info', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ url: v }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '解析失败');
    render(j);
    pushHist(v);
    setStatus('');
  } catch (e) {
    setStatus('✗ ' + e.message, true);
  } finally { go.disabled = false; }
}

function render(j) {
  curKey = j.key;
  const { info, stream } = j;
  const isDy = info.platform === 'douyin';
  result.innerHTML = `
    <div class="card">
      ${info.cover ? `<img class="cover" src="/api/proxy?u=${encodeURIComponent(info.cover)}" alt="封面">` : ''}
      <div class="body">
        <div><span class="badge ${isDy ? 'dy' : 'bl'}">${isDy ? '抖音' : 'B站'}</span>${info.type === 'images' ? '<span class="badge" style="background:#5c6370">图集 ' + info.imagesCount + ' 张</span>' : ''}</div>
        <div class="title">${esc(info.title)}</div>
        <div class="meta">UP：${esc(info.author || '未知')}${info.durationMs ? ' · ' + fmtDur(info.durationMs) : ''}${info.stats && info.stats.like != null ? ' · 赞 ' + info.stats.like : ''}${info.stats && info.stats.view != null ? ' · 播放 ' + info.stats.view : ''}</div>
        <div class="q">${info.type === 'video' ? `画质 <b>${esc(stream.quality)}</b>${stream.totalBytes ? ' · 约 ' + fmtMB(stream.totalBytes) : ''}${stream.multiSegment ? ' · 免登录流共 ' + stream.multiSegment + ' 段，下载第 1 段' : ''}` : '点击下方按钮逐张保存'}</div>
        <div class="actions" id="acts"></div>
        ${info.parts && info.parts.length > 1 ? '<div class="parts" id="parts"></div>' : ''}
        ${info.type === 'images' ? '<div class="gal" id="gal"></div>' : ''}
      </div>
    </div>`;
  const acts = result.querySelector('#acts');

  if (info.type === 'video') {
    const a = document.createElement('a');
    a.className = 'btn-main'; a.textContent = '⇩ 下载视频';
    a.href = '/api/dl?key=' + curKey;
    acts.appendChild(a);
  }
  if (info.type === 'images') {
    const b = document.createElement('button');
    b.className = 'btn-main'; b.textContent = '⇩ 全部下载（逐张另存）';
    b.onclick = () => saveImages(info);
    acts.appendChild(b);
  }

  if (info.parts && info.parts.length > 1) {
    const parts = result.querySelector('#parts');
    info.parts.forEach((p) => {
      const b = document.createElement('button');
      b.textContent = 'P' + p.page + ' ' + (p.title || '').slice(0, 14);
      if (info.title.includes('P' + p.page + ':')) b.classList.add('on');
      b.onclick = () => { input.value = `https://www.bilibili.com/video/${info.id}?p=${p.page}`; run(); };
      parts.appendChild(b);
    });
  }
  if (info.type === 'images' && info.images && info.images.length) {
    const gal = result.querySelector('#gal');
    gal.innerHTML = '';
    info.images.forEach((u, i) => {
      const a = document.createElement('a');
      a.href = `/api/proxy?u=${encodeURIComponent(u)}&n=${encodeURIComponent(info.filename + '_' + String(i + 1).padStart(2, '0') + '.jpg')}`;
      a.title = '点击保存第 ' + (i + 1) + ' 张';
      const img = document.createElement('img');
      img.src = '/api/proxy?u=' + encodeURIComponent(u);
      img.loading = 'lazy';
      a.appendChild(img);
      gal.appendChild(a);
    });
  }
}

function saveImages(info) {
  setStatus('已发起 ' + info.images.length + ' 张下载，请在浏览器弹窗中允许「下载多个文件」，逐张自动另存…');
  info.images.forEach((u, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = `/api/proxy?u=${encodeURIComponent(u)}&n=${encodeURIComponent(info.filename + '_' + String(i + 1).padStart(2, '0') + '.jpg')}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, i * 800);
  });
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

go.onclick = run;
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
loadHist();
</script>
</body>
</html>
