plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('HUB_KEYSTORE_FILE')

android {
    if (releaseKeystore) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('HUB_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HUB_KEY_ALIAS')
                keyPassword System.getenv('HUB_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    namespace 'com.yaoxiovo.hub'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yaoxiovo.hub'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.7.1'
    }

    sourceSets {
        main.assets.srcDir('ui/dist')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
