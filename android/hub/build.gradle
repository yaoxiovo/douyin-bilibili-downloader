plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yaoxiovo.hub'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yaoxiovo.hub'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '0.6.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
