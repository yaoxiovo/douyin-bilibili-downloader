plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yaoxiovo.hub'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yaoxiovo.hub'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '0.7.0'
    }

    sourceSets {
        main.assets.srcDir('ui/dist')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
