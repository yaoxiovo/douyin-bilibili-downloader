name: YaoXi Hub CI

on:
  pull_request:
    paths:
      - 'android/hub/**'
      - 'android/*.gradle'
      - 'android/gradle.properties'
      - 'android/gradle/wrapper/**'
      - 'android/gradlew'
      - 'hub-api/**'
      - 'scripts/ci/**'
      - '.github/workflows/yaoxi-hub.yml'
  push:
    branches: [main]
    paths:
      - 'android/hub/**'
      - 'android/*.gradle'
      - 'android/gradle.properties'
      - 'android/gradle/wrapper/**'
      - 'android/gradlew'
      - 'hub-api/**'
      - 'scripts/ci/**'
      - '.github/workflows/yaoxi-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: Check Hub API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: hub-api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: hub-api/.node-version
      - run: npm run check

  android:
    name: Build Hub APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
      signed: ${{ steps.sign.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version-file: android/hub/ui/.node-version
          cache: npm
          cache-dependency-path: android/hub/ui/package-lock.json
      - name: Install Hub UI dependencies
        working-directory: android/hub/ui
        run: npm ci --ignore-scripts
      - name: Bundle Fuxsto Hub UI
        working-directory: android/hub/ui
        run: npm run build
      - id: version
        name: Read Hub version
        shell: bash
        run: |
          version=$(bash scripts/ci/hub-version.sh)
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: android
        run: bash gradlew :hub:assembleDebug --stacktrace
      - name: Name APK
        run: cp android/hub/build/outputs/apk/debug/hub-debug.apk yaoxi-hub-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: yaoxi-hub-apk
          path: yaoxi-hub-debug.apk
          retention-days: 30
          if-no-files-found: error

      - id: sign
        name: Build signed release APK
        if: github.ref == 'refs/heads/main'
        working-directory: android
        env:
          HUB_KEYSTORE_BASE64: ${{ secrets.HUB_KEYSTORE_BASE64 }}
          HUB_KEYSTORE_PASSWORD: ${{ secrets.HUB_KEYSTORE_PASSWORD }}
          HUB_KEY_ALIAS: ${{ secrets.HUB_KEY_ALIAS }}
          HUB_KEY_PASSWORD: ${{ secrets.HUB_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$HUB_KEYSTORE_BASE64$HUB_KEYSTORE_PASSWORD$HUB_KEY_ALIAS$HUB_KEY_PASSWORD" ]]; then
            echo "Release signing is not configured. The debug APK is available in Artifacts."
            exit 0
          fi
          : "${HUB_KEYSTORE_BASE64:?}" "${HUB_KEYSTORE_PASSWORD:?}" "${HUB_KEY_ALIAS:?}" "${HUB_KEY_PASSWORD:?}"
          umask 077
          export HUB_KEYSTORE_FILE="$(mktemp)"
          trap 'rm -f "$HUB_KEYSTORE_FILE"' EXIT
          printf '%s' "$HUB_KEYSTORE_BASE64" | base64 --decode > "$HUB_KEYSTORE_FILE"
          unset HUB_KEYSTORE_BASE64
          bash gradlew :hub:assembleRelease --stacktrace
          cp hub/build/outputs/apk/release/hub-release.apk ../yaoxi-hub.apk
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.available == 'true'
        with:
          name: yaoxi-hub-release-apk
          path: yaoxi-hub.apk
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish Hub tag and APK
    if: github.ref == 'refs/heads/main' && needs.android.outputs.signed == 'true'
    needs: [api, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: hub-release-${{ needs.android.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: yaoxi-hub-release-apk
          path: output_apks
      - name: Publish version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HUB_VERSION: ${{ needs.android.outputs.version }}
        run: bash scripts/ci/publish-hub.sh "$HUB_VERSION" output_apks/yaoxi-hub.apk
