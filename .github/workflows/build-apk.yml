name: Build & Release Android APK

on:
  pull_request:
    paths:
      - 'android/app/**'
      - 'android/*.gradle'
      - 'android/gradle.properties'
      - 'android/gradle/wrapper/**'
      - 'android/gradlew'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/app/**'
      - 'android/*.gradle'
      - 'android/gradle.properties'
      - 'android/gradle/wrapper/**'
      - 'android/gradlew'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build downloader APKs
        working-directory: android
        shell: bash
        run: |
          bash gradlew :app:assembleDebug --stacktrace
          if ! bash gradlew :app:assembleRelease --stacktrace; then
            echo "::warning::Downloader release variant failed; the debug APK is available."
          fi
      - name: Package downloader APKs
        shell: bash
        run: |
          source_dir=android/app/build/outputs/apk
          mkdir -p output_apks
          cp "$source_dir/debug/app-debug.apk" output_apks/douyin-bilibili-downloader-debug.apk
          if [[ -f "$source_dir/release/app-release.apk" ]]; then
            cp "$source_dir/release/app-release.apk" output_apks/douyin-bilibili-downloader-release.apk
            cp "$source_dir/release/app-release.apk" output_apks/douyin-bilibili-downloader.apk
          else
            cp "$source_dir/debug/app-debug.apk" output_apks/douyin-bilibili-downloader.apk
            if [[ -f "$source_dir/release/app-release-unsigned.apk" ]]; then
              cp "$source_dir/release/app-release-unsigned.apk" output_apks/douyin-bilibili-downloader-release-unsigned.apk
            fi
          fi
      - name: Upload downloader APKs
        uses: actions/upload-artifact@v4
        with:
          name: douyin-bilibili-downloader-apk
          path: output_apks/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: douyin-bilibili-downloader-apk
          path: output_apks
      - uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: output_apks/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
